spring.application.name=QuickPoll

# PostgreSQL (local install, database: quickpoll)
spring.datasource.url=jdbc:postgresql://localhost:5432/quickpolldb
spring.datasource.username=postgres
spring.datasource.password=Akshay16
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (needed for high-concurrency voting)
spring.datasource.hikari.maximum-pool-size=30

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=your-secret-key-change-this-in-production-must-be-at-least-32-characters-long
app.jwt.expiration-ms=86400000
